# Builds module.zip and publishes a GitHub release.
# Start it either by pushing a version tag (e.g. v0.5.3) or from the Actions tab:
#   Actions → Release → Run workflow → enter the version (e.g. 0.5.3).
# Foundry installs/updates from the manifest URL in module.json, which always points at the latest release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (e.g. 0.5.3). Leave blank to use module.json's version."
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out version and tag
        id: ver
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
            VERSION="${VERSION#v}"
            [ -z "$VERSION" ] && VERSION="$(jq -r .version module.json)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Stamp version and download URL into module.json
        run: |
          DOWNLOAD="https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ steps.ver.outputs.tag }}/module.zip"
          jq --arg v "${{ steps.ver.outputs.version }}" --arg d "$DOWNLOAD" '.version = $v | .download = $d' module.json > module.tmp
          mv module.tmp module.json
          cat module.json

      - name: Build module.zip
        run: |
          FILES="module.json README.md scripts styles"
          [ -d lib ] && FILES="$FILES lib"
          zip -r module.zip $FILES

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Galaxy Map ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          make_latest: true
          files: |
            module.json
            module.zip
