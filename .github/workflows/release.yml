# Builds module.zip and publishes a GitHub release whenever a version tag (e.g. v0.5.3) is pushed.
# Foundry installs/updates from the manifest URL in module.json, which always points at the latest release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp version and download URL into module.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DOWNLOAD="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/module.zip"
          jq --arg v "$VERSION" --arg d "$DOWNLOAD" '.version = $v | .download = $d' module.json > module.tmp
          mv module.tmp module.json
          cat module.json

      - name: Build module.zip
        run: |
          FILES="module.json README.md scripts styles"
          [ -d lib ] && FILES="$FILES lib"
          zip -r module.zip $FILES

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            module.json
            module.zip
